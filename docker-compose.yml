version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: preeti_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: preeti_converter
    volumes:
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: preeti_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/preeti_converter
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: preeti_web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
